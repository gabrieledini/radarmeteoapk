name: Build APK Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # serve solo per pubblicare la Release sui tag v*

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Versione
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=$BASE-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Dipendenze
        run: npm install --no-audit --no-fund

      - name: Prepara web (Leaflet locale)
        run: npm run build

      - name: Crea progetto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npm run patch:android

      - name: Icone e splash
        continue-on-error: true   # se fallisce si usano le icone predefinite di Capacitor
        run: npm run icons

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compila e firma APK release
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Rinomina APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/radar-meteo-$VERSION_NAME-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/radar-meteo-$VERSION_NAME.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: radar-meteo-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Pubblica Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
