<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1d28">
<title>Radar Meteo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-now" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <!-- condizioni -->
    <symbol id="w-sun" viewBox="0 0 48 48"><circle cx="24" cy="24" r="8" fill="#ffc861"/><g stroke="#ffc861" stroke-width="3" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g></symbol>
    <symbol id="w-moon" viewBox="0 0 48 48"><path d="M30 8a15 15 0 1 0 10 26A13 13 0 0 1 30 8z" fill="#d9e3ea"/></symbol>
    <symbol id="w-part" viewBox="0 0 48 48"><circle cx="18" cy="17" r="7" fill="#ffc861"/><g stroke="#ffc861" stroke-width="2.6" stroke-linecap="round"><path d="M18 4v3.5M5 17h3.5M8.8 7.8l2.4 2.4M27.2 7.8l-2.4 2.4"/></g><path d="M16 38h20a8 8 0 0 0 0-16 11 11 0 0 0-20.5 4A6 6 0 0 0 16 38z" fill="#c9d4dc"/></symbol>
    <symbol id="w-cloud" viewBox="0 0 48 48"><path d="M13 36h23a9 9 0 0 0 0-18 12 12 0 0 0-22.6 4.5A7 7 0 0 0 13 36z" fill="#c9d4dc"/></symbol>
    <symbol id="w-rain" viewBox="0 0 48 48"><path d="M13 28h23a8.5 8.5 0 0 0 0-17 11.5 11.5 0 0 0-21.7 4.3A6.5 6.5 0 0 0 13 28z" fill="#aab7c1"/><g stroke="#55b4ff" stroke-width="3" stroke-linecap="round"><path d="M17 33l-2 6M25 33l-2 6M33 33l-2 6"/></g></symbol>
    <symbol id="w-storm" viewBox="0 0 48 48"><path d="M13 27h23a8.5 8.5 0 0 0 0-17 11.5 11.5 0 0 0-21.7 4.3A6.5 6.5 0 0 0 13 27z" fill="#8a97a3"/><path d="M25 29l-5 8h5l-3 7 9-10h-5l3-5z" fill="#ffc861"/><g stroke="#55b4ff" stroke-width="3" stroke-linecap="round"><path d="M15 32l-2 6M35 32l-2 6"/></g></symbol>
  </defs>
</svg>

<div id="map" aria-label="Mappa di nuvole e pioggia"></div>
<div id="progress" hidden><i></i></div>

<section id="station" aria-live="polite">
  <button id="homeName" class="place" aria-expanded="false" aria-controls="search">
    <svg class="ic"><use href="#i-pin"/></svg><span>Viareggio</span><svg class="ic chev"><use href="#i-chev"/></svg>
  </button>
  <div class="now">
    <svg id="wIcon" class="wx" viewBox="0 0 48 48"><use href="#w-cloud"/></svg>
    <div>
      <div id="wText" class="cond">—</div>
      <div id="homeT" class="at">in attesa dei dati</div>
    </div>
  </div>
  <dl class="vals">
    <div><dt>Nuvole</dt><dd id="hC">—</dd></div>
    <div><dt>Prob. pioggia</dt><dd id="hP">—</dd></div>
    <div><dt>Pioggia</dt><dd id="hR">—</dd></div>
  </dl>
  <div id="search" hidden>
    <div class="srow">
      <input id="q" type="search" placeholder="Cerca una città" autocomplete="off" aria-label="Cerca località">
      <button id="geo" class="sq" title="Usa la mia posizione" aria-label="Usa la mia posizione"><svg class="ic"><use href="#i-locate"/></svg></button>
    </div>
    <ul id="results"></ul>
  </div>
</section>

<div id="tools">
  <button id="refresh" class="round" aria-label="Aggiorna i dati" title="Aggiorna i dati"><svg class="ic"><use href="#i-refresh"/></svg></button>
  <button id="recenter" class="round" aria-label="Centra sulla tua località" title="Centra sulla tua località"><svg class="ic"><use href="#i-pin"/></svg></button>
</div>

<section id="dock">
  <div class="row">
    <button id="play" class="play" aria-label="Avvia animazione"><svg class="ic"><use href="#i-play"/></svg></button>
    <div id="time" class="time"><b>—</b><small>caricamento…</small></div>
    <button id="toNow" class="chip" title="Torna all'ora attuale"><svg class="ic"><use href="#i-now"/></svg><span class="lbl-t">Adesso</span></button>
    <button id="speed" class="chip" aria-label="Velocità animazione">1×</button>
  </div>

  <div id="tl">
    <canvas id="spark" aria-hidden="true"></canvas>
    <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Ora visualizzata">
  </div>
  <div id="ticks" aria-hidden="true"></div>

  <details id="more">
    <summary>Livelli e legenda<svg class="ic chev"><use href="#i-chev"/></svg></summary>
    <div class="layers" role="group" aria-label="Livelli visibili">
      <label class="tog"><input type="checkbox" id="lyRain" checked><span>Pioggia</span></label>
      <label class="tog"><input type="checkbox" id="lyCloud" checked><span>Nuvole</span></label>
    </div>
    <div class="legend">
      <div class="bar"></div>
      <div class="lab"><span>0,2</span><span>1</span><span>2,5</span><span>5</span><span>10</span><span>25 mm/h</span></div>
      <div class="cl"><i></i>Copertura nuvolosa. Tocca la mappa per leggere i valori in un punto.</div>
    </div>
    <label class="opac"><span>Intensità</span><input type="range" id="opacity" min="30" max="100" value="75" aria-label="Opacità del livello"></label>
  </details>
  <div id="status" role="status"></div>
</section>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
